<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Subtrack: evidența abonamentelor recurente, alerte înainte de plăți, statistici și recomandări de economisire." />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <title>Subtrack</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var theme = 'system'
        var lang = 'ro'
        try {
          var raw = localStorage.getItem('subtrack-v1')
          if (raw) {
            var state = JSON.parse(raw).state || {}
            if (state.settings) {
              theme = state.settings.theme || theme
              lang = state.settings.lang || lang
            }
          }
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.lang = lang
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
